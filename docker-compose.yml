version: "3.8"

services:
  nginx:
    image: nginx:alpine
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8888:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cloudpaste-network
    restart: unless-stopped

  frontend:
    image: dragon730/cloudpaste-frontend:latest
    environment:
      - TZ=Asia/Shanghai
      - BACKEND_URL=https://cloud.fengcloud.online:8443
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - cloudpaste-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: cloudpaste-backend:local
    environment:
      - TZ=CST-8
      - NODE_ENV=production
      - PORT=8787
      - ENCRYPTION_SECRET=default-encryption-key
      - ADMIN_TOKEN_EXPIRY_DAYS=7
      - TASK_WORKER_POOL_SIZE=2
      - TELEGRAM_LONG_REQUEST_TIMEOUT_MS=1800000
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./sql_data:/data
    networks:
      - cloudpaste-network
    restart: unless-stopped

networks:
  cloudpaste-network:
    driver: bridge
